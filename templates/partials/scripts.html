<script>
// ── Web Audio API sound engine ────────────────────────────────────────────────
var ctx = null;

// iOS AudioContext unlock — must happen on first user gesture
document.addEventListener('touchstart', function() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  ctx.resume();
}, { once: true, passive: true });

function playAttack() {
  if (!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = 120;
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.3);
}

function playCrit() {
  if (!ctx) return;
  var t = ctx.currentTime;
  [880, 1320, 1760].forEach(function(f, i) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.2, t + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.18);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i * 0.1); osc.stop(t + i * 0.1 + 0.22);
  });
}

function playSpell() {
  if (!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator(), g = ctx.createGain();
  osc.frequency.setValueAtTime(300, t);
  osc.frequency.linearRampToValueAtTime(900, t + 0.15);
  osc.frequency.linearRampToValueAtTime(600, t + 0.3);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.35);
}

function playEnemyAttack() {
  if (!ctx) return;
  var t = ctx.currentTime;
  var sz = Math.floor(ctx.sampleRate * 0.2);
  var buf = ctx.createBuffer(1, sz, ctx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
  var noise = ctx.createBufferSource(); noise.buffer = buf;
  var flt = ctx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = 200;
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  noise.connect(flt); flt.connect(g); g.connect(ctx.destination);
  noise.start(t); noise.stop(t + 0.2);
  var osc = ctx.createOscillator(), og = ctx.createGain();
  osc.type = 'sawtooth'; osc.frequency.value = 60;
  og.gain.setValueAtTime(0.2, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.connect(og); og.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.25);
}

function playLevelup() {
  if (!ctx) return;
  var t = ctx.currentTime;
  [523, 659, 784, 1047].forEach(function(f, i) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.2, t + i * 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.28);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i * 0.12); osc.stop(t + i * 0.12 + 0.32);
  });
}

function playVictory() {
  if (!ctx) return;
  var t = ctx.currentTime;
  [523, 659, 784].forEach(function(f) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.5);
  });
  [523, 659, 784, 1047].forEach(function(f) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.15, t + 0.55); g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + 0.55); osc.stop(t + 1.2);
  });
}

function playDeath() {
  if (!ctx) return;
  var t = ctx.currentTime;
  [392, 330, 277, 220].forEach(function(f, i) {
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.2, t + i * 0.22);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.22 + 0.35);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t + i * 0.22); osc.stop(t + i * 0.22 + 0.4);
  });
}

function playUIClick() {
  if (!ctx) return;
  var t = ctx.currentTime;
  var osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'square'; osc.frequency.value = 1200;
  g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.03);
}

// ── Touch sound triggers ──────────────────────────────────────────────────────
document.addEventListener('touchstart', function(e) {
  var btn = e.target.closest('button');
  if (!btn || !ctx) return;
  var val = btn.value || '';
  if (val === 'attack') playAttack();
  else if (val.indexOf('ability_') === 0) playSpell();
  else playUIClick();
}, { passive: true });

// ── Page-load animation and sound triggers ────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // Crit flash + sound
  if (document.querySelector('.msg-crit')) {
    var ec = document.querySelector('.enemy-card');
    if (ec) ec.classList.add('crit-flash');
    setTimeout(playCrit, 100);
  }
  // Enemy attack + HP bar shake
  if (document.querySelector('.msg-enemy')) {
    var bt = document.querySelector('.bar-track');
    if (bt) bt.classList.add('damaged');
    setTimeout(playEnemyAttack, 100);
  }
  // Level up glow + sound
  if (document.querySelector('.msg-levelup')) {
    var sb = document.querySelector('.status-bar');
    if (sb) sb.classList.add('levelup');
    setTimeout(playLevelup, 100);
  }
  // Victory sound
  if (document.querySelector('.msg-victory')) {
    setTimeout(playVictory, 100);
  }
  // Death sound
  if (document.querySelector('.gameover-title')) {
    setTimeout(playDeath, 300);
  }
});
</script>
